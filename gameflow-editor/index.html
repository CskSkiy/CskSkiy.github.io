<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Flow Blueprint</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/jsplumb@2.15.6/dist/js/jsplumb.min.js"></script>

</head>
<body>

<div id="toolbar">

<button onclick="createNode()">新增節點</button>

<button onclick="saveJson()">匯出JSON</button>

<button onclick="loadJson()">載入JSON</button>

<button onclick="exportAI()">AI格式</button>

<input type="file" id="fileLoader" hidden>

</div>

<div id="container">

<div id="propertyPanel">

<h3>屬性表</h3>

<div id="emptySelection">
請選取節點
</div>

<div id="nodeEditor" style="display:none">

<label>步驟內容</label>
<textarea id="nodeText"></textarea>

<label>
<input type="checkbox" id="enableColor">
顏色
</label>

<input type="color" id="nodeColor">

<label>
<input type="checkbox" id="enableTag">
TAG
</label>

<input type="text"
id="nodeTag"
placeholder="#Quest #Battle">

<label>
<input type="checkbox" id="enableStatus">
狀態
</label>

<select id="nodeStatus">
<option value="todo">未完成</option>
<option value="done">已完成</option>
<option value="bug">有Bug</option>
</select>

<label>備註</label>
<textarea id="nodeNote"></textarea>

<button onclick="updateNode()">
套用修改
</button>

</div>

</div>

<div id="canvas"></div>

</div>

<script src="app.js"></script>

</body>
</html>
